input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/ojdbc8.jar"
    jdbc_driver_class => "Java::oracle.jdbc.OracleDriver"
    jdbc_connection_string => "jdbc:oracle:thin:@host.docker.internal:1521/orcl"
    jdbc_user => "EOC20"
    jdbc_password => "${ORACLE_PASSWORD}"
    jdbc_validate_connection => true
    jdbc_paging_enabled => true
    jdbc_page_size => 5000
    lowercase_column_names => true
    sql_log_level => "info"
    schedule => "* * * * *"
    type => "eoc_order"

    statement => "
      SELECT
        CWDOCID                              AS order_id,
        TRIM(OSTATE)                         AS ostate,
        CREATIONDATE                         AS creation_date,
        COMPLETIONDATE                       AS completion_date,
        LASTUPDATEDDATE                      AS last_updated_date,
        NVL(LASTUPDATEDDATE, CREATIONDATE)   AS sync_time
      FROM CWORDERINSTANCE
      WHERE NVL(LASTUPDATEDDATE, CREATIONDATE) > :sql_last_value
      ORDER BY NVL(LASTUPDATEDDATE, CREATIONDATE) ASC
    "

    use_column_value => true
    tracking_column => "sync_time"
    tracking_column_type => "timestamp"
    clean_run => true
  }
}

filter {
  if ![order_id] {
    drop { }
  }

  ruby {
    code => '
      creation = event.get("creation_date")
      if creation
        event.set("@timestamp", creation)
      end

      ostate = event.get("ostate").to_s.strip
      event.set("ostate", ostate)

      event.set("is_completed", ostate == "C_C")
      event.set("is_failed",    ostate == "C_X")
      executing = ["O_R_PR_PONR", "O_R_PRO", "O_R_PR", "O_NR_SUB"].include?(ostate)
      event.set("is_executing", executing)

      comp = event.get("completion_date") || (event.get("is_completed") ? event.get("last_updated_date") : nil)
      crea = event.get("creation_date")
      if comp && crea
        begin
          t_comp = comp.is_a?(LogStash::Timestamp) ? comp.time.to_f : (comp.is_a?(Time) ? comp.to_f : Time.parse(comp.to_s).to_f)
          t_crea = crea.is_a?(LogStash::Timestamp) ? crea.time.to_f : (crea.is_a?(Time) ? crea.to_f : Time.parse(crea.to_s).to_f)
          if t_comp && t_crea
            duration = t_comp - t_crea
            event.set("completion_seconds", duration.round(1)) if duration >= 0 && duration < 31_536_000
          end
        rescue => e
        end
      end

      if executing && crea
        begin
          last_up = event.get("last_updated_date") || crea
          t_last = last_up.is_a?(LogStash::Timestamp) ? last_up.time.to_f : (last_up.is_a?(Time) ? last_up.to_f : Time.parse(last_up.to_s).to_f)
          t_crea = crea.is_a?(LogStash::Timestamp) ? crea.time.to_f : (crea.is_a?(Time) ? crea.to_f : Time.parse(crea.to_s).to_f)
          if t_last && t_crea
            age_sec = t_last - t_crea
            event.set("executing_age_seconds", age_sec.round(1)) if age_sec >= 0
            event.set("is_backlog_15m", age_sec >= 900)
          else
            event.set("is_backlog_15m", false)
          end
        rescue => e
          event.set("is_backlog_15m", false)
        end
      else
        event.set("is_backlog_15m", false)
      end
    '
  }

  mutate {
    remove_field => ["@version", "tags", "sync_time"]
  }
}

output {
  opensearch {
    hosts => ["https://opensearch-node1:9200"]
    index => "eoc-orders"
    action => "index"
    document_id => "%{order_id}"
    user => "admin"
    password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ssl => true
    ssl_certificate_verification => false
    manage_template => false
  }
}
