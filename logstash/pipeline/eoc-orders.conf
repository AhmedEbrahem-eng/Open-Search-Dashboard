input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/ojdbc8.jar"
    jdbc_driver_class => "Java::oracle.jdbc.OracleDriver"
    jdbc_connection_string => "jdbc:oracle:thin:@host.docker.internal:1521/orcl"
    jdbc_user => "EOC20"
    jdbc_password => "${ORACLE_PASSWORD}"
    jdbc_validate_connection => true
    jdbc_paging_enabled => true
    jdbc_page_size => 5000
    lowercase_column_names => true
    sql_log_level => "info"
    schedule => "* * * * *"
    type => "eoc_order"

    statement => "
      SELECT
        o.CWDOCID                              AS order_id,
        TRIM(o.OSTATE)                         AS ostate,
        o.CREATIONDATE                         AS creation_date,
        o.COMPLETIONDATE                       AS completion_date,
        o.LASTUPDATEDDATE                      AS last_updated_date,
        NVL(o.LASTUPDATEDDATE, o.CREATIONDATE) AS sync_time,
        o.CANCELLATIONREASON                   AS cancellation_reason,
        NVL(o.ISCANCELLATION, 0)               AS is_cancellation,
        CASE
          WHEN o.NEWACTIVATIONUC = 1 THEN 'New Activation'
          WHEN o.UPDOWNGRADEUC = 1 THEN 'Plan Change'
          WHEN o.SIMSWAPUC = 1 THEN 'SIM Swap'
          WHEN o.RENEWALUC = 1 THEN 'Renewal'
          WHEN o.PORTINUC = 1 THEN 'Port In'
          WHEN o.PORTOUTUC = 1 THEN 'Port Out'
          WHEN o.RESUMESUBSCRIPTIONUC = 1 THEN 'Resume Subscription'
          WHEN o.TERMINATESUBSCRIPTIONUC = 1 THEN 'Terminate Subscription'
          WHEN o.RECHARGEUC = 1 THEN 'Recharge'
          WHEN o.TRANSFERBALANCEUC = 1 THEN 'Transfer Balance'
          WHEN o.TRANSFERUC = 1 THEN 'Transfer'
          WHEN o.TRANSFEROWNERSHIPUC = 1 THEN 'Transfer Ownership'
          WHEN o.ADJUSTWALLETUC = 1 THEN 'Adjust Wallet'
          WHEN o.WALLETSHARINGUC = 1 THEN 'Wallet Sharing'
          WHEN o.SETSHARINGLIMITSUC = 1 THEN 'Set Sharing Limits'
          WHEN o.CONFIGURESUBSCRIPTIONUC = 1 THEN 'Configure Subscription'
          WHEN o.CONFIGUREEXTENDVALIDITYUC = 1 THEN 'Configure Extend Validity'
          WHEN o.SUSPENDSUBSCRIPTIONUC = 1 THEN 'Suspend Subscription'
          WHEN o.DELETESUBSCRIPTIONUC = 1 THEN 'Delete Subscription'
          WHEN o.TERMINATEACCOUNTUC = 1 THEN 'Terminate Account'
          WHEN o.PLANSTARTDATEUC = 1 THEN 'Plan Start Date'
          WHEN o.EDITSIMALIASUC = 1 THEN 'Edit SIM Alias'
          WHEN o.PRIVACYSETTINGSUC = 1 THEN 'Privacy Settings'
          WHEN o.STANDALONEDEVICEUC = 1 THEN 'Standalone Device'
          WHEN o.SETRECURRENCEUC = 1 THEN 'Set Recurrence'
          ELSE NVL(o.ORDERTYPE, 'Other')
        END                                    AS use_case,

        CASE      
            WHEN TRIM(o.OSTATE) = 'C_X' THEN
            (
              SELECT MAX(m.STEPNAME) KEEP (DENSE_RANK LAST ORDER BY NVL(m.CREATION_TIME, TO_TIMESTAMP('1970-01-01', 'YYYY-MM-DD')))
              FROM CWMESSAGELOG m
              WHERE m.ORDER_ID = o.CWDOCID
                AND (m.STEPNAME LIKE '%ERROR%' OR m.FAILURE != 0 OR m.STEPNAME LIKE 'ESB%')
            )
          ELSE NULL
        END                                    AS raw_step

      FROM CWORDERINSTANCE o
      WHERE NVL(o.LASTUPDATEDDATE, o.CREATIONDATE) > :sql_last_value
      ORDER BY NVL(o.LASTUPDATEDDATE, o.CREATIONDATE) ASC
    "

    use_column_value => true
    tracking_column => "sync_time"
    tracking_column_type => "timestamp"
    clean_run => true
  }
}

filter {
  if ![order_id] {
    drop { }
  }

  ruby {
    code => '
      creation = event.get("creation_date")
      event.set("@timestamp", creation) if creation

      ostate = event.get("ostate")
      is_comp = (ostate == "C_C")
      is_cancelled = (event.get("is_cancellation").to_i == 1 || ostate == "O_R_X")
      is_fail = (ostate == "C_X" && !is_cancelled)
      executing = ["O_R_PR_PONR", "O_R_PRO", "O_R_PR", "O_NR_SUB", "O_R_SUB", "O_NR_SCH"].include?(ostate)

      # In-flight order sub-states
      is_order_scheduled       = (ostate == "O_NR_SCH")
      is_order_not_started     = ["O_NR_SUB", "O_R_SUB"].include?(ostate)
      is_order_processing      = ["O_R_PR", "O_R_PRO"].include?(ostate)
      is_order_processing_ponr = (ostate == "O_R_PR_PONR")

      event.set("is_completed", is_comp)
      event.set("is_cancelled", is_cancelled)
      event.set("is_failed",    is_fail)
      event.set("is_executing", executing)

      event.set("is_order_scheduled",       is_order_scheduled)
      event.set("is_order_not_started",     is_order_not_started)
      event.set("is_order_processing",      is_order_processing)
      event.set("is_order_processing_ponr", is_order_processing_ponr)

      # Numeric 1/0 flags for native Data Table Sum columns
      event.set("completed_count", is_comp ? 1 : 0)
      event.set("cancelled_count", is_cancelled ? 1 : 0)
      event.set("failed_count",    is_fail ? 1 : 0)
      event.set("executing_count", executing ? 1 : 0)

      event.set("order_scheduled_count",       is_order_scheduled ? 1 : 0)
      event.set("order_not_started_count",     is_order_not_started ? 1 : 0)
      event.set("order_processing_count",      is_order_processing ? 1 : 0)
      event.set("order_processing_ponr_count", is_order_processing_ponr ? 1 : 0)

      # Cancellation categories
      reason = event.get("cancellation_reason").to_s
      is_cancel_in_progress = (ostate == "O_R_X" || (is_cancelled && ostate.to_s.start_with?("O_")))
      is_cancel_system = is_cancelled && !is_cancel_in_progress && (
        ["C_A", "C_REV", "C_Y"].include?(ostate) ||
        (reason =~ /(TimedOut|Timeout|Error|Fail)/i ? true : false)
      )
      is_cancel_client = is_cancelled && !is_cancel_in_progress && !is_cancel_system

      event.set("is_cancelled_by_system",       is_cancel_system)
      event.set("is_cancelled_by_client",       is_cancel_client)
      event.set("is_cancellation_in_progress",  is_cancel_in_progress)

      event.set("cancelled_by_system_count",      is_cancel_system ? 1 : 0)
      event.set("cancelled_by_client_count",      is_cancel_client ? 1 : 0)
      event.set("cancellation_in_progress_count", is_cancel_in_progress ? 1 : 0)

      # Clean failed step name for "Top Failed EOC Steps"
      if is_fail
        raw = event.get("raw_step")
        if raw && !raw.to_s.strip.empty?
          step = raw.to_s.strip
          if step =~ /^(ESB_\d+)_([A-Za-z0-9]+)/
            step = "#{$1} #{$2}"
          else
            step = step.gsub(/_/, " ")
          end
          event.set("failed_step", step)
        end
      end

      # Duration in seconds for completed orders
      comp = event.get("completion_date") || (is_comp ? event.get("last_updated_date") : nil)
      if comp && creation
        begin
          t_comp = comp.respond_to?(:time) ? comp.time.to_f : (comp.is_a?(Time) ? comp.to_f : Time.parse(comp.to_s).to_f)
          t_crea = creation.respond_to?(:time) ? creation.time.to_f : (creation.is_a?(Time) ? creation.to_f : Time.parse(creation.to_s).to_f)
          if t_comp && t_crea
            duration = t_comp - t_crea
            event.set("completion_seconds", duration.round(1)) if duration >= 0 && duration < 31_536_000
          end
        rescue => e
        end
      end
    '
  }

  mutate {
    remove_field => ["@version", "tags", "sync_time", "raw_step"]
  }
}

output {
  opensearch {
    hosts => ["https://opensearch-node1:9200"]
    index => "eoc-orders"
    action => "index"
    document_id => "%{order_id}"
    user => "admin"
    password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ssl => true
    ssl_certificate_verification => false
    manage_template => false
  }
}
