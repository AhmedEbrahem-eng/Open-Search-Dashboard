input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/ojdbc8.jar"
    jdbc_driver_class   => "Java::oracle.jdbc.OracleDriver"
    jdbc_connection_string => "jdbc:oracle:thin:@host.docker.internal:1521/orcl"
    jdbc_user           => "EOC20"
    jdbc_password       => "${ORACLE_PASSWORD}"
    jdbc_validate_connection => true
    lowercase_column_names => true
    schedule            => "*/15 * * * *"  # Polled every 15 minutes
    type                => "oracle_tablespace"

    statement           => "
      SELECT 
        df.tablespace_name                                                        AS tablespace,
        ROUND(df.total_bytes / (1024 * 1024 * 1024), 2)                           AS allocated_gb,
        ROUND((df.total_bytes - NVL(fs.free_bytes, 0)) / (1024 * 1024 * 1024), 2) AS used_gb,
        ROUND(NVL(fs.free_bytes, 0) / (1024 * 1024 * 1024), 2)                    AS free_gb,
        ROUND((df.total_bytes - NVL(fs.free_bytes, 0)) / df.total_bytes, 4)       AS usage_pct
      FROM 
        (
          SELECT tablespace_name, SUM(bytes) AS total_bytes 
          FROM dba_data_files 
          GROUP BY tablespace_name
        ) df
      LEFT JOIN 
        (
          SELECT tablespace_name, SUM(bytes) AS free_bytes 
          FROM dba_free_space 
          GROUP BY tablespace_name
        ) fs ON df.tablespace_name = fs.tablespace_name
      ORDER BY usage_pct DESC
    "
  }
}

filter {
  if [type] == "oracle_tablespace" {
    ruby {
      code => '
        event.set("allocated_str", "#{event.get("allocated_gb")} GB")
        event.set("used_str", "#{event.get("used_gb")} GB")
        event.set("free_str", "#{event.get("free_gb")} GB")

        usage_pct = event.get("usage_pct").to_f
        usage_pct_100 = (usage_pct * 100).round(1)
        event.set("usage_str", "#{usage_pct_100}%")

        if usage_pct >= 0.90
          event.set("health", "Critical")
        elsif usage_pct >= 0.75
          event.set("health", "Warning")
        else
          event.set("health", "Healthy")
        end
      '
    }
  }
}

output {
  if [type] == "oracle_tablespace" {
    opensearch {
      hosts         => ["https://opensearch-node1:9200"]
      index         => "oracle-storage-metrics"
      document_id   => "%{tablespace}"
      action        => "index"
      user          => "admin"
      password      => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
      ssl           => true
      ssl_certificate_verification => false
    }
  }
}
